<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音钥 MusicKey · 本地加密音乐格式转换</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237c5cff'/%3E%3Cpath d='M9 18V6l10-2v11' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='6.5' cy='18' r='2.5' fill='white'/%3E%3Ccircle cx='16.5' cy='15' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">♫</div>
        <div>
          <h1>音钥 <span>MusicKey</span></h1>
          <p>加密音乐变回标准音频 · 全程本地处理 · 不上传</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="health" class="pill">连接中…</span>
        <button id="exitBtn" class="ghost danger" title="退出本地服务">退出</button>
      </div>
    </header>

    <section class="hero" id="drop">
      <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v11"></path>
          <circle cx="6.5" cy="18" r="2.5"></circle>
          <circle cx="16.5" cy="15" r="2.5"></circle>
        </svg>
      </div>
      <h2>把加密音乐<em>拖进来</em></h2>
      <p>单个文件、整个文件夹都可以 · 自动识别格式 · 可批量打包下载</p>
      <div class="chips">
        <span>.ncm</span><span>.mflac</span><span>.mgg</span><span>.qmc*</span>
        <span>.tkm</span><span>.kgm</span><span>.kgma</span><span>.vpr</span><span>.kwm</span>
      </div>
      <button class="primary big" id="pickBtn">选择文件</button>
      <input type="file" id="picker" multiple hidden accept=".ncm,.mflac,.mgg,.mflac0,.mgg0,.mgg1,.mggl,.mmp4,.qmcflac,.qmcogg,.qmc0,.qmc2,.qmc3,.qmc4,.qmc6,.qmc8,.tkm,.bkcmp3,.bkcm4a,.bkcflac,.bkcwav,.bkcape,.bkcogg,.bkcwma,.666c6163,.6d7033,.6f6767,.6d3461,.776176,.kgm,.kgma,.vpr,.kwm,.kgm.flac,.vpr.flac">
    </section>

    <section class="settings">
      <label>
        <span>输出格式</span>
        <select id="format">
          <option value="">保持原样</option>
          <option value="mp3">MP3 · 320k</option>
          <option value="flac">FLAC · 无损</option>
          <option value="m4a">M4A · AAC 256k</option>
          <option value="wav">WAV · PCM</option>
          <option value="ogg">OGG · Vorbis q6</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="embedCover" checked>
        <span class="switch"></span>
        <span>嵌入标签与封面</span>
      </label>
      <label class="ekey">
        <span>EKey <i>可选</i></span>
        <input type="text" id="ekey" placeholder="新版 QQ 音乐无内嵌密钥时填写">
      </label>
      <span class="secure">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        仅监听 127.0.0.1
      </span>
    </section>

    <section class="workbar">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input id="filter" type="search" placeholder="筛选文件名…">
        <button class="ghost" id="clearBtn">清空完成</button>
        <button class="primary" id="zipBtn" disabled>打包下载全部</button>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>
    <section id="empty" class="empty">
      <div class="empty-icon">♪</div>
      <p>还没有文件。拖入加密音乐，几秒钟后下载标准格式。</p>
    </section>

    <section class="foot">
      <div>
        <strong>支持范围</strong><br>
        网易云 <code>.ncm</code> · QQ 音乐 <code>.mflac/.mgg/.qmc*/.tkm</code> · 酷狗 <code>.kgm/.kgma/.vpr</code> · 酷我 <code>.kwm</code>
      </div>
      <div>
        <strong>合规提示</strong><br>
        请仅处理自己合法获得、有权使用的本地文件。本工具不包含任何遥测。
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
